<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parro card · synthetic preview</title>
<style>
:root { --primary-color:#0084bd; --primary-text-color:#212121; --secondary-text-color:#626262; --card-background-color:#fff; --ha-card-background:#fff; --divider-color:#ddd; --secondary-background-color:#f2f3f4; --text-primary-color:#fff; --ha-card-border-radius:12px; --ha-card-border-width:1px; --ha-font-family-body:Roboto,Arial,sans-serif; color-scheme:light; }
:root.dark { --primary-color:#64c4ec; --primary-text-color:#e6e6e6; --secondary-text-color:#b8b8b8; --card-background-color:#252525; --ha-card-background:#252525; --divider-color:#484848; --secondary-background-color:#343434; --text-primary-color:#111; color-scheme:dark; }
body { margin:0; font:14px Roboto,Arial,sans-serif; color:var(--primary-text-color); background:var(--secondary-background-color); }
header { padding:18px 24px; background:var(--card-background-color); border-bottom:1px solid var(--divider-color); font-size:18px; }
main { padding:24px 16px; max-width:720px; margin:0 auto; }
.fixture-note { margin:0 0 16px; color:var(--secondary-text-color); font-size:12px; line-height:1.5; }
#editor { margin-top:24px; padding:20px; border-radius:12px; background:var(--card-background-color); }
#editor h2 { font-size:18px; font-weight:400; margin:0 0 20px; }
@media(max-width:460px){header{padding:16px} main{padding:16px 12px}}
</style>
<script type="module" src="./harness.js"></script>
</head>
<body><header>Home Assistant · Parro</header><main><p class="fixture-note">Synthetische voorvertoning. Alle berichten, accounts en testafbeeldingen zijn verzonnen.</p><div id="mount"></div><section id="editor" hidden><h2>Kaartinstellingen</h2></section></main></body>
</html>
